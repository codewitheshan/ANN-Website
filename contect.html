<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ANN</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body id="page-contact">
    <header class="main-header">
        <div class="top-bar container">
            <div class="logo">
                <a href="index.html">
                    <span class="logo-ann">ANN</span>
                    <span class="logo-text">Ashish News Network</span>
                </a>
            </div>
            <div class="header-actions"><button id="theme-toggle">🌓</button></div>
        </div>
    </header>

    <main class="container page-spacing layout-with-sidebar">
        <div class="main-content">
            <h1>Contact Us</h1>
            <form id="contact-form" class="admin-form">
                <div class="form-group">
                    <label>Name</label>
                    <input type="text" id="c-name" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="c-email" required>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <input type="text" id="c-subject" required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea id="c-message" rows="5" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Send Message</button>
            </form>
        </div>
        <aside class="sidebar">
            <h3>Office Info</h3>
            <p>📍 ANN Headquarters, Bhopal, MP</p>
            <p>📞 +91 98765 43210</p>
            <p>📧 contact@ashishnews.com</p>
        </aside>
    </main>
    
    <div id="toast" class="toast"></div>
    <script src="js/script.js"></script>
</body>
</html>
